<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>已搬家 · navi.x1shang.top</title>
<!--
  老域名（我们都.是.gay / xn--vnqp08bwj8a.xn--0iv.gay）的跳转桩。
  内容已迁到 https://navi.x1shang.top/，这里只负责把人和路径一起送过去。
  路径靠 JS 保留（/wetbulb → https://navi.x1shang.top/wetbulb）；
  没有 JS 时退化成 <meta refresh> 到新域名首页。
  改动请同时改 404.html（子路径都由 404.html 接管）。
-->
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://navi.x1shang.top/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="x1shang 的导航页">
<meta property="og:title" content="这个域名搬家了 · navi.x1shang.top">
<meta property="og:description" content="导航页搬到了 https://navi.x1shang.top/，老域名会保留路径把人送过去。">
<meta property="og:url" content="https://navi.x1shang.top/">
<meta property="og:image" content="https://navi.x1shang.top/og-cover.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://navi.x1shang.top/og-cover.png">
<script>
  (function () {
    var suffix = location.pathname + location.search + location.hash;
    var secure = 'https://navi.x1shang.top' + suffix;
    var plain = 'http://navi.x1shang.top' + suffix;
    var done = false;
    function go(u) { if (!done) { done = true; location.replace(u); } }
    // 新域名的证书有可能还在签发：先探一下 https，探不通就先走 http。
    // 一旦新域名开了强制 HTTPS，这个 http 会被 301 回 https，所以退让路径是自愈的。
    var probe = new Image();
    probe.onload = function () { go(secure); };
    probe.onerror = function () { go(plain); };
    probe.src = 'https://navi.x1shang.top/og-cover.png?probe=' + Date.now();
    setTimeout(function () { go(secure); }, 1500);   // 探测超时 → 仍按 https 走
  })();
</script>
<meta http-equiv="refresh" content="2;url=https://navi.x1shang.top/">
<style>
  :root{--bg:#08080e;--fg:#ececf4;--dim:#9a9ab0;--line:rgba(255,255,255,.10)}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;display:flex;align-items:center;justify-content:center;padding:28px;
    background:
      radial-gradient(58rem 38rem at 12% -8%, rgba(255,110,199,.20), transparent 62%),
      radial-gradient(52rem 36rem at 92% 112%, rgba(103,232,249,.18), transparent 62%),
      var(--bg);
    color:var(--fg);
    font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .box{
    width:100%;max-width:560px;text-align:center;
    border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.045);
    padding:40px 30px 34px;backdrop-filter:blur(6px);
  }
  .bar{height:3px;border-radius:99px;background:linear-gradient(90deg,#ff6ec7,#f9a8d4,#a78bfa,#67e8f9);opacity:.85;margin:-8px 0 28px}
  h1{
    margin:0 0 10px;font-size:clamp(21px,4.6vw,27px);font-weight:700;
    background:linear-gradient(100deg,#ffd9f0,#e9d5ff 45%,#cffafe);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  p{margin:0 0 22px;color:var(--dim)}
  .host{
    display:inline-block;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:15.5px;color:#cffafe;border:1px dashed rgba(103,232,249,.45);
    border-radius:11px;padding:7px 14px;margin-bottom:24px;word-break:break-all;
  }
  a.go{
    display:inline-block;text-decoration:none;color:#0a0a11;font-weight:600;
    background:linear-gradient(100deg,#ff9ad5,#c4b5fd 55%,#8ee9f7);
    border-radius:12px;padding:11px 22px;
  }
  a.go:hover{filter:brightness(1.06)}
  .note{margin:22px 0 0;font-size:12.5px;color:#6f6f85}
</style>
</head>
<body>
  <div class="box">
    <div class="bar"></div>
    <h1>这个域名搬家了</h1>
    <p>导航页现在住在 ——</p>
    <div class="host">navi.x1shang.top</div>
    <p style="margin:0 0 6px"><a class="go" href="https://navi.x1shang.top/">这就过去 →</a></p>
    <p class="note">老域名会一直把人送到新地址，原来收藏的 <code>/wetbulb</code> 这类路径也会跟着走。</p>
  </div>
</body>
</html>
