<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5f7">
  <meta name="description" content="稍等片刻，正在前往 x1shang 的导航页。">
  <meta name="robots" content="noindex, follow">
  <title>稍等片刻 · x1shang</title>
  <link rel="canonical" href="https://navi.x1shang.top/">
  <noscript><meta http-equiv="refresh" content="6;url=https://navi.x1shang.top/"></noscript>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f4f5f7'/%3E%3Ctext x='9' y='44' font-family='Arial,sans-serif' font-size='38' font-weight='700' fill='%232f6fb5'%3Ex1%3C/text%3E%3C/svg%3E">
  <link rel="preload" href="/assets/manrope-variable.ttf" as="font" type="font/ttf" crossorigin>
  <script>
    (() => {
      const query = new URLSearchParams(location.search);
      const systemTheme = matchMedia('(prefers-color-scheme: dark)');
      let preference = 'system';
      try { preference = localStorage.getItem('x1-theme') || 'system'; } catch {}
      const previewTheme = query.get('preview') === '1' ? query.get('theme') : null;
      if (previewTheme === 'light' || previewTheme === 'dark') preference = previewTheme;
      if (!['light', 'dark', 'system'].includes(preference)) preference = 'system';
      function applyTheme() {
        const theme = preference === 'system' ? (systemTheme.matches ? 'dark' : 'light') : preference;
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#111820' : '#f4f5f7';
        const toggle = document.getElementById('theme-toggle');
        if (toggle) {
          toggle.setAttribute('aria-label', theme === 'dark' ? '切换浅色模式' : '切换暗色模式');
          toggle.setAttribute('aria-pressed', String(theme === 'dark'));
          toggle.title = toggle.getAttribute('aria-label');
        }
      }
      systemTheme.addEventListener('change', applyTheme);
      document.addEventListener('DOMContentLoaded', () => {
        const toggle = document.getElementById('theme-toggle');
        toggle.hidden = false;
        toggle.addEventListener('click', () => {
          preference = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
          try { localStorage.setItem('x1-theme', preference); } catch {}
          applyTheme();
        });
        applyTheme();
      });
      applyTheme();
    })();
  </script>
  <style>
    @font-face {
      font-family: Manrope;
      font-style: normal;
      font-weight: 200 800;
      font-display: swap;
      src: url('/assets/manrope-variable.ttf') format('truetype');
    }

    :root {
      color-scheme: light;
      --ink: #28323a;
      --muted: #7f878f;
      --faint: #98a0a7;
      --link: #2f6fb5;
      --link-hover: #4a90d9;
      --cloud: #f4f5f7;
      --cloud-2: #eceff3;
      --line: rgba(120, 130, 140, .2);
      --glow: #fff;
      --heart: #f07676;
      --mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --ink: #dce5ef;
      --muted: #a9b6c5;
      --faint: #95a5b8;
      --link: #87b9f3;
      --link-hover: #bad8ff;
      --cloud: #111820;
      --cloud-2: #1d2835;
      --line: rgba(157, 176, 199, .2);
      --glow: #1b2736;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { min-width: 280px; }
    body {
      margin: 0;
      background: var(--cloud);
      background-image: radial-gradient(ellipse at 72% 30%, var(--glow), transparent 62%);
      color: var(--ink);
      font: 15px/1.8 Manrope, 'Microsoft YaHei', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--link); text-decoration: none; }
    a:hover { color: var(--link-hover); text-decoration: underline; text-underline-offset: 5px; }
    :focus-visible { outline: 2px solid var(--link); outline-offset: 5px; }
    button { font: inherit; color: inherit; cursor: pointer; }

    .masthead {
      position: absolute;
      inset: 28px 4% auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    .wordmark {
      color: var(--ink);
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1;
    }
    .wordmark:hover { color: var(--ink); text-decoration: none; }
    .masthead-caption {
      margin-right: auto;
      margin-left: 10px;
      color: var(--faint);
      font-size: 9px;
      letter-spacing: 2.4px;
    }
    .theme-toggle {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
    }
    .theme-toggle:hover { border-color: var(--line); background: var(--cloud-2); color: var(--ink); }
    .theme-toggle svg { grid-area: 1 / 1; width: 17px; height: 17px; }
    .sun { display: none; }
    [data-theme="dark"] .sun { display: block; }
    [data-theme="dark"] .moon { display: none; }

    main {
      display: flex;
      min-height: 100vh;
      min-height: 100svh;
      align-items: center;
      justify-content: center;
      padding: 112px 24px 76px;
      text-align: center;
    }
    .checkpoint { width: min(100%, 820px); }
    h1 {
      margin: 0 0 35px;
      font-size: clamp(21px, 3.4vw, 36px);
      font-weight: 700;
      letter-spacing: -.035em;
      line-height: 1.5;
      text-wrap: balance;
    }
    .mascot-src { display: contents; }   /* <picture> 不进布局，img 仍是直接子元素，居中规则不变 */
    .mascot {
      display: block;
      width: clamp(230px, 29vw, 320px);
      max-width: 100%;
      height: auto;
      margin: 0 auto 23px;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }
    .loading {
      display: flex;
      min-height: 27px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 0;
      font-size: 14px;
    }
    .spinner {
      width: 13px;
      height: 13px;
      border: 1.5px solid var(--line);
      border-top-color: var(--link);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .details { margin: 15px auto 0; font-size: 12px; color: var(--muted); }
    summary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 4px 10px;
      border-radius: 5px;
      cursor: pointer;
      list-style: none;
    }
    summary::-webkit-details-marker { display: none; }
    summary::before {
      width: 0;
      height: 0;
      border-top: 3px solid transparent;
      border-bottom: 3px solid transparent;
      border-left: 4px solid currentColor;
      content: '';
      transition: transform .18s ease;
    }
    summary:hover { color: var(--link); }
    details[open] summary::before { transform: rotate(90deg); }
    .details-copy { max-width: 350px; margin: 12px auto 0; padding: 14px 18px; border-top: 1px solid var(--line); }
    .details-copy p { margin: 0; }
    .details-copy p + p { margin-top: 5px; }
    .destination { font-family: var(--mono); font-size: 11px; overflow-wrap: anywhere; }
    .credit { margin: 31px 0 0; color: var(--muted); font-size: 13px; line-height: 2.1; text-wrap: balance; }
    .credit .author { font-weight: 600; }
    .country { font-family: var(--mono); font-size: .95em; }
    .heart { display: inline-block; margin: 0 3px; color: var(--heart); }
    .site-link { white-space: nowrap; }
    noscript p { margin: 12px 0 0; color: var(--muted); font-size: 12px; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 480px) {
      .masthead { inset: 22px 22px auto; }
      .masthead-caption { margin-left: 2px; font-size: 8px; letter-spacing: 1.8px; }
      main { padding: 105px 20px 64px; }
      h1 { margin-bottom: 28px; font-size: clamp(18px, 5.6vw, 25px); }
      .mascot { width: min(76vw, 280px); margin-bottom: 23px; }
      .credit { max-width: 290px; margin: 27px auto 0; font-size: 12px; }
    }
    @media (max-height: 600px) and (min-width: 481px) {
      main { padding-top: 94px; padding-bottom: 35px; }
      h1 { margin-bottom: 18px; font-size: 27px; }
      .mascot { width: 210px; margin-bottom: 12px; }
      .credit { margin-top: 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <a class="wordmark" data-redirect href="https://navi.x1shang.top/" aria-label="前往 x1shang 导航页">x1 /</a>
    <span class="masthead-caption">A PERSONAL SPACE</span>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换暗色模式" aria-pressed="false" hidden>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 13.1A8.5 8.5 0 0 1 10.9 3.5 8.5 8.5 0 1 0 20.5 13.1Z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3.8"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
    </button>
  </header>
  <main>
    <section class="checkpoint" aria-labelledby="heading">
      <h1 id="heading">正在确认你是不是机器人！</h1>
      <picture class="mascot-src">
        <source type="image/avif" srcset="/assets/fishstew-inspector.avif">
        <source type="image/webp" srcset="/assets/fishstew-inspector.webp">
        <img class="mascot" id="mascot" src="/assets/fishstew-inspector.webp" width="1254" height="1254" alt="蓝发的 fishstew 坐在鱼汤锅里，拿着放大镜认真观察你。" fetchpriority="high" decoding="async">
      </picture>
      <p class="loading" role="status"><span class="spinner" aria-hidden="true"></span><span id="status-text">加载中...</span></p>
      <details class="details">
        <summary>详情</summary>
        <div class="details-copy">
          <p>稍等片刻，正在前往 x1shang 的导航页。</p>
          <p id="redirect-note">将在 <span id="countdown">6</span> 秒后自动跳转；也可以直接点击下方链接。</p>
          <p class="destination">→ <a id="destination-link" data-redirect href="https://navi.x1shang.top/">https://navi.x1shang.top/</a></p>
        </div>
      </details>
      <p class="credit"><a class="author" href="https://x1shang.top/">x1shang</a>在<span class="country">CN</span>用<span class="heart">♥</span>制作，正在跳转到<a class="site-link" data-redirect href="https://navi.x1shang.top/">navi.x1shang.top</a></p>
      <noscript><p>将在 6 秒后进入导航页，也可以点击上方 navi.x1shang.top 链接。</p></noscript>
    </section>
  </main>
  <script>
    (() => {
      // Both entry points keep the original path, query and fragment.
      const destination = 'https://navi.x1shang.top' + location.pathname + location.search + location.hash;
      document.querySelectorAll('[data-redirect]').forEach(link => { link.href = destination; });
      document.getElementById('destination-link').textContent = destination;
      const redirectDelay = 6000;
      const preview = new URLSearchParams(location.search).get('preview') === '1';
      const status = document.getElementById('status-text');
      const countdown = document.getElementById('countdown');
      let redirectTimer;
      let countdownTimer;

      function clearTimers() {
        clearTimeout(redirectTimer);
        clearInterval(countdownTimer);
      }

      function startRedirect() {
        if (preview) {
          document.getElementById('redirect-note').textContent = '预览模式：自动跳转已暂停。';
          return;
        }
        const deadline = Date.now() + redirectDelay;
        countdownTimer = setInterval(() => {
          countdown.textContent = String(Math.max(0, Math.ceil((deadline - Date.now()) / 1000)));
        }, 250);
        redirectTimer = setTimeout(() => {
          clearTimers();
          status.textContent = '正在跳转...';
          location.replace(destination);
        }, redirectDelay);
      }

      window.addEventListener('pagehide', clearTimers);
      if (document.readyState === 'complete') startRedirect();
      else window.addEventListener('load', startRedirect, { once: true });
    })();
  </script>
</body>
</html>
